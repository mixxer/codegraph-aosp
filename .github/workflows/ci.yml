{
  "name": "External contributions 01e0 validation",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "stage": {
          "type": "choice",
          "options": [
            "candidate",
            "published"
          ],
          "default": "candidate"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "env": {
    "CODEGRAPH_TELEMETRY": "0",
    "CODEGRAPH_NO_UPDATE_CHECK": "1"
  },
  "jobs": {
    "guard": {
      "name": "Verify current remote refs",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "VALIDATION_STAGE": "${{ inputs.stage }}"
          },
          "run": "python3 - <<'PY'\nimport json,os,urllib.request\ndef get(path):\n req=urllib.request.Request('https://api.github.com/repos/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})\n with urllib.request.urlopen(req,timeout=30) as f:return json.load(f)\nrows=get('mixxer/codegraph-aosp/git/matching-refs/heads')\nrefs={v['ref'].removeprefix('refs/heads/'):v['object']['sha'] for v in rows}\nexpected={'fix/java-kotlin-inheritance': 'e817803bb79fc461d19075758ba1e128529d3ba7', 'feat/android-platform-tools': 'def81a76163fb0fb469f7959e1b6c1af1c69228d', 'fix/mcp-project-cache-lifetime': 'a2e01c915470518c9d457f6de71095adfecfcd2d', 'docs/contributing-guide': '55f9761bd0f437351c11f65e65c949a84978cf05', 'fix/kotlin-imported-type-calls': '08c716f16b16ee0f55284264b8e0dacef4d018b3', 'fix/java-static-field-calls': 'a3e7dcdfa94eaad866d5c873be307eeb05b353ef'} if os.environ['VALIDATION_STAGE']=='published' else {'fix/java-kotlin-inheritance': '7afee836d8488b9533a18f3dcd11c9df708462a5', 'feat/android-platform-tools': '231f959da16f809244bfaafb5e1959162c7d7235', 'fix/mcp-project-cache-lifetime': 'af5e560ba2414df15fd231b753032dc46403713b', 'docs/contributing-guide': '691f067c012e7708f5241cfb8a74c2d2c4c9634c', 'fix/kotlin-imported-type-calls': '7d0faad04295c6d1dd93bc3cfd663340cbd86f9a', 'fix/java-static-field-calls': '261cc306d45b18ef6fc4788f949550401309993c'}\nprotected={'main': '0d7bf8b0cd91aff2d940c8e04a99385225308ce0', 'fix/android-platform-language-coverage': 'f7bc8ab31dc4e0b69955eeba046b9f61ecc7d0d4', 'fix/project-path-realpath': '4c8f64415f47228986dcac7e4ad2c7ca6e886797'}\nfor b,h in {**expected,**protected}.items(): assert refs.get(b)==h,(b,h,refs.get(b))\nassert get('colbymchenry/codegraph/branches/main')['commit']['sha']=='01e0ac3aa7419a7ab75583963e8a95359f3af1d3'\nassert get('colbymchenry/codegraph/pulls/2258')['head']['sha']=='77814af1278ff01c860a276e7262d4ffcdba7126'\nprint('Exact feature refs, protected downstream refs, current upstream and unchanged PR2258 confirmed.')\nPY"
        }
      ]
    },
    "portable": {
      "name": "${{ matrix.target }} portable Node ${{ matrix.node }}",
      "needs": "guard",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 35,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 8,
        "matrix": {
          "include": [
            {
              "target": "baseline",
              "sha": "01e0ac3aa7419a7ab75583963e8a95359f3af1d3",
              "node": 22
            },
            {
              "target": "baseline",
              "sha": "01e0ac3aa7419a7ab75583963e8a95359f3af1d3",
              "node": 24
            },
            {
              "target": "1927",
              "sha": "e817803bb79fc461d19075758ba1e128529d3ba7",
              "node": 22
            },
            {
              "target": "1927",
              "sha": "e817803bb79fc461d19075758ba1e128529d3ba7",
              "node": 24
            },
            {
              "target": "1928",
              "sha": "def81a76163fb0fb469f7959e1b6c1af1c69228d",
              "node": 22
            },
            {
              "target": "1928",
              "sha": "def81a76163fb0fb469f7959e1b6c1af1c69228d",
              "node": 24
            },
            {
              "target": "1929",
              "sha": "a2e01c915470518c9d457f6de71095adfecfcd2d",
              "node": 22
            },
            {
              "target": "1929",
              "sha": "a2e01c915470518c9d457f6de71095adfecfcd2d",
              "node": 24
            },
            {
              "target": "1931",
              "sha": "55f9761bd0f437351c11f65e65c949a84978cf05",
              "node": 22
            },
            {
              "target": "1931",
              "sha": "55f9761bd0f437351c11f65e65c949a84978cf05",
              "node": 24
            },
            {
              "target": "1948",
              "sha": "08c716f16b16ee0f55284264b8e0dacef4d018b3",
              "node": 22
            },
            {
              "target": "1948",
              "sha": "08c716f16b16ee0f55284264b8e0dacef4d018b3",
              "node": 24
            },
            {
              "target": "1949",
              "sha": "a3e7dcdfa94eaad866d5c873be307eeb05b353ef",
              "node": 22
            },
            {
              "target": "1949",
              "sha": "a3e7dcdfa94eaad866d5c873be307eeb05b353ef",
              "node": 24
            },
            {
              "target": "compat1948-2258",
              "sha": "d6300550c37d6984e0116e80b5572b5c22fa41e3",
              "node": 22
            },
            {
              "target": "compat1948-2258",
              "sha": "d6300550c37d6984e0116e80b5572b5c22fa41e3",
              "node": 24
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "${{ matrix.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source commit",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD)\" = \"${{ matrix.sha }}\"\necho \"Validated source ${{ matrix.sha }}\""
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": "${{ matrix.node }}",
            "cache": "npm"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "run": "npm run build"
        },
        {
          "run": "mkdir -p \"$HOME/.ssh\""
        },
        {
          "name": "Full portable engine and viewer",
          "env": {
            "CODEGRAPH_KERNEL": "0"
          },
          "run": "npm test -- --maxWorkers=2 --minWorkers=1"
        },
        {
          "name": "Documentation links",
          "if": "matrix.target == '1931'",
          "run": "node <<'JS'\nconst fs=require('fs'),p=require('path');for(const f of ['CONTRIBUTING.md','README.md','docs/README.md'])for(const m of fs.readFileSync(f,'utf8').matchAll(/\\]\\(([^)]+)\\)/g)){const u=m[1];if(u.includes('://')||u.startsWith('#')||u.startsWith('mailto:'))continue;if(!fs.existsSync(p.resolve(p.dirname(f),u.split(/[?#]/)[0])))throw Error(f+': '+u)}console.log('Documentation links resolve.');\nJS"
        }
      ]
    },
    "windows": {
      "name": "${{ matrix.target }} Windows Node ${{ matrix.node }}",
      "needs": "guard",
      "runs-on": "windows-latest",
      "timeout-minutes": 25,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 4,
        "matrix": {
          "include": [
            {
              "target": "baseline",
              "sha": "01e0ac3aa7419a7ab75583963e8a95359f3af1d3",
              "node": 22
            },
            {
              "target": "baseline",
              "sha": "01e0ac3aa7419a7ab75583963e8a95359f3af1d3",
              "node": 24
            },
            {
              "target": "1928",
              "sha": "def81a76163fb0fb469f7959e1b6c1af1c69228d",
              "node": 22
            },
            {
              "target": "1928",
              "sha": "def81a76163fb0fb469f7959e1b6c1af1c69228d",
              "node": 24
            },
            {
              "target": "1929",
              "sha": "a2e01c915470518c9d457f6de71095adfecfcd2d",
              "node": 22
            },
            {
              "target": "1929",
              "sha": "a2e01c915470518c9d457f6de71095adfecfcd2d",
              "node": 24
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "${{ matrix.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source commit",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD)\" = \"${{ matrix.sha }}\"\necho \"Validated source ${{ matrix.sha }}\""
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": "${{ matrix.node }}",
            "cache": "npm"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "run": "npm run build"
        },
        {
          "name": "Use an unambiguous Windows test temp path",
          "shell": "pwsh",
          "run": "$testTemp = Join-Path $env:RUNNER_TEMP 'codegraph-tests'\nNew-Item -ItemType Directory -Force $testTemp | Out-Null\n\"TEMP=$testTemp\" >> $env:GITHUB_ENV\n\"TMP=$testTemp\" >> $env:GITHUB_ENV\n"
        },
        {
          "name": "Windows path, watcher, MCP lifetime and Android regressions",
          "shell": "bash",
          "env": {
            "CODEGRAPH_KERNEL": "0",
            "VALIDATION_TARGET": "${{ matrix.target }}"
          },
          "run": "python - <<'PY'\nimport glob,os,subprocess\npatterns=['security.test.ts','mcp-nested-repo-projectpath.test.ts','mcp-roots.test.ts','mcp-initialize.test.ts','mcp-project-cache.test.ts','mcp-idle-release-order.test.ts','worktree-detection.test.ts','watcher.test.ts','ui-server.test.ts','cli-ui-command.test.ts']\nif os.environ['VALIDATION_TARGET']=='1928': patterns+=['aosp-*.test.ts','mcp-tool-allowlist.test.ts']\nfiles=sorted({p for pat in patterns for p in glob.glob('__tests__/'+pat)})\nassert files\nsubprocess.run(['npx','vitest','run',*files,'--maxWorkers=2','--minWorkers=1'],check=True)\nPY"
        }
      ]
    },
    "native": {
      "name": "${{ matrix.target }} native kernel and language regressions",
      "needs": [
        "portable",
        "windows"
      ],
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 45,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 4,
        "matrix": {
          "include": [
            {
              "target": "baseline",
              "sha": "01e0ac3aa7419a7ab75583963e8a95359f3af1d3"
            },
            {
              "target": "1927",
              "sha": "e817803bb79fc461d19075758ba1e128529d3ba7"
            },
            {
              "target": "1928",
              "sha": "def81a76163fb0fb469f7959e1b6c1af1c69228d"
            },
            {
              "target": "1929",
              "sha": "a2e01c915470518c9d457f6de71095adfecfcd2d"
            },
            {
              "target": "1931",
              "sha": "55f9761bd0f437351c11f65e65c949a84978cf05"
            },
            {
              "target": "1948",
              "sha": "08c716f16b16ee0f55284264b8e0dacef4d018b3"
            },
            {
              "target": "1949",
              "sha": "a3e7dcdfa94eaad866d5c873be307eeb05b353ef"
            },
            {
              "target": "compat1948-2258",
              "sha": "d6300550c37d6984e0116e80b5572b5c22fa41e3"
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "${{ matrix.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source commit",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD)\" = \"${{ matrix.sha }}\"\necho \"Validated source ${{ matrix.sha }}\""
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": 22,
            "cache": "npm"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "name": "Build fresh native kernel after every full portable suite",
          "run": "bash scripts/build-kernel.sh --target x86_64-unknown-linux-gnu"
        },
        {
          "run": "npm run build"
        },
        {
          "name": "Require binary and twenty-language native contract",
          "env": {
            "CODEGRAPH_KERNEL_EXPECT": "1"
          },
          "run": "test -s codegraph-kernel/prebuilds/linux-x64/codegraph-kernel.node\nnode -e \"const assert=require('node:assert/strict'),l=require('./dist/extraction/kernel/loader'),k=l.getKernel();assert(k);const c=k.contractInfo();assert.equal(c.languages.length,20);for(const v of c.languages)assert(l.kernelSupports(v));assert(!l.kernelSupports('objc'));console.log(JSON.stringify(c));\""
        },
        {
          "name": "Native parity, language, MCP and Android regressions",
          "env": {
            "CODEGRAPH_KERNEL_EXPECT": "1"
          },
          "run": "python3 - <<'PY'\nimport glob,subprocess\npatterns=['kernel-*.test.ts', 'kotlin-*.test.ts', 'java-*.test.ts', 'aosp-*.test.ts', 'rust-*.test.ts', 'ruby-*.test.ts', 'go-*.test.ts', 'pascal-*.test.ts', 'frameworks-integration.test.ts', 'extraction.test.ts', 'resolution.test.ts', 'function-ref*.test.ts', 'generic-supertypes.test.ts', 'override-overload-pairing.test.ts', 'mcp-project-cache.test.ts', 'mcp-idle-release-order.test.ts', 'security.test.ts', 'mcp-tool-allowlist.test.ts', 'mcp-initialize.test.ts', 'mcp-roots.test.ts', 'watcher.test.ts', 'enclosing-class-member-call.test.ts', 'sync-framework-detection.test.ts', 'path-alias-overlap.test.ts']\nfiles=sorted({p for pat in patterns for p in glob.glob('__tests__/'+pat)})\nassert files\nsubprocess.run(['npx','vitest','run',*files,'--maxWorkers=2','--minWorkers=1'],check=True)\nPY"
        }
      ]
    },
    "checks": {
      "name": "All external contribution validation complete",
      "if": "always()",
      "needs": [
        "guard",
        "portable",
        "windows",
        "native"
      ],
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "env": {
            "GUARD": "${{ needs.guard.result }}",
            "PORTABLE": "${{ needs.portable.result }}",
            "WINDOWS": "${{ needs.windows.result }}",
            "NATIVE": "${{ needs.native.result }}"
          },
          "run": "test \"$GUARD\" = success\ntest \"$PORTABLE\" = success\ntest \"$WINDOWS\" = success\ntest \"$NATIVE\" = success"
        }
      ]
    }
  }
}
