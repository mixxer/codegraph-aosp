{
  "name": "Windows d494 full portable compatibility",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "CODEGRAPH_TELEMETRY": "0",
    "CODEGRAPH_NO_UPDATE_CHECK": "1"
  },
  "jobs": {
    "windows": {
      "name": "${{ matrix.target }} Windows Node ${{ matrix.node }}",
      "runs-on": "windows-latest",
      "timeout-minutes": 60,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "target": "upstream",
              "sha": "d494e432eded708b061a75dadc6f6c0306cad40f",
              "node": 22
            },
            {
              "target": "upstream",
              "sha": "d494e432eded708b061a75dadc6f6c0306cad40f",
              "node": 24
            },
            {
              "target": "main",
              "sha": "b50e0545ad97c29a75e7fae13fc6c8cea487ff47",
              "node": 22
            },
            {
              "target": "main",
              "sha": "b50e0545ad97c29a75e7fae13fc6c8cea487ff47",
              "node": 24
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "${{ matrix.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source SHA",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD)\" = \"${{ matrix.sha }}\"\necho \"Validated source ${{ matrix.sha }}\""
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": "${{ matrix.node }}",
            "cache": "npm"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "run": "npm run build"
        },
        {
          "name": "Use an unambiguous Windows test temp path",
          "shell": "pwsh",
          "run": "$testTemp = Join-Path $env:RUNNER_TEMP 'codegraph-tests'\nNew-Item -ItemType Directory -Force $testTemp | Out-Null\n\"TEMP=$testTemp\" >> $env:GITHUB_ENV\n\"TMP=$testTemp\" >> $env:GITHUB_ENV\nWrite-Output \"Test temporary directory: $testTemp\"\n"
        },
        {
          "name": "Full portable engine and viewer",
          "shell": "bash",
          "env": {
            "CODEGRAPH_KERNEL": "0"
          },
          "run": "npm test -- --maxWorkers=2"
        }
      ]
    },
    "checks": {
      "name": "Windows validation complete",
      "needs": "windows",
      "if": "always()",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "env": {
            "RESULT": "${{ needs.windows.result }}"
          },
          "run": "test \"$RESULT\" = success"
        }
      ]
    }
  }
}
