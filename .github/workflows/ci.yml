name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CODEGRAPH_TELEMETRY: '0'
  CODEGRAPH_NO_UPDATE_CHECK: '1'
jobs:
  verified:
    name: Verify published heads and full validation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check exact published refs and prior full portable/native results
        run: |
          python3 - <<'PY'
          import json, urllib.request

          def read(path):
              with urllib.request.urlopen('https://api.github.com/repos/mixxer/codegraph-aosp/' + path, timeout=30) as response:
                  return json.load(response)
          first = read('actions/runs/39714365273')
          recovery = read('actions/runs/39715582824')
          assert first['head_sha'] == '36532dbe4457832208d2d83da5815fc854375666'
          assert recovery['head_sha'] == 'fa67e7753b8c05c56dbfd3b70556efb9df58e9c6' and recovery['conclusion'] == 'success'
          prior = {job['name']: job for job in read('actions/runs/39714365273/jobs?per_page=100')['jobs']}
          expected = {f'{target} portable Node {node}' for target in ['baseline', '1927', '1929', '1930', '1931', '1948', '1949'] for node in [22, 24]}
          expected.update(['baseline Windows security', '1930 Windows security', '1929 Windows MCP'])
          assert all(prior[name]['conclusion'] == 'success' for name in expected)
          fixed = {job['name']: job for job in read('actions/runs/39715582824/jobs?per_page=100')['jobs']}
          expected_fixed = {'1928 portable Node 22', '1928 portable Node 24', '1928 Windows MCP'}
          expected_fixed.update(f'{target} native kernel and language regressions' for target in ['baseline', '1927', '1928', '1948', '1949'])
          assert all(fixed[name]['conclusion'] == 'success' for name in expected_fixed)
          refs = {'fix/java-kotlin-inheritance': '54bdde21f28fa9499c85df24ed9668905e7dc0aa', 'feat/android-platform-tools': '8e77a4cef84e483078c1b35ce0f6c2d79cbf89d4', 'fix/mcp-project-cache-lifetime': '1ff11b545f7f47a6b08c1702b3b52c4f21bb3a0e', 'fix/project-path-realpath': '3fe323f3b171135e009b49f657bedbbb0c3f1d8f', 'docs/contributing-guide': '668de06953b13e8b97828ac432be50fdbd39b4ed', 'fix/kotlin-imported-type-calls': '45bc0e7f2db6b791f3c4240deecc41bdd8220606', 'fix/java-static-field-calls': '4b5a7e18f718c869a00bffdf6ae27f9564f33dc7', 'main': '6dde0e8b4568ab6797da34b33250cb994ac198e8', 'fix/android-platform-language-coverage': 'd1e05ef4d039bbbecc8e96cd8a8e1e31277b9b6c'}
          for branch, sha in refs.items():
              actual = read('git/ref/heads/' + branch)['object']['sha']
              assert actual == sha, (branch, sha, actual)
              print(branch, actual)
          print('Verified published heads match the commits that passed full Node22/24, Windows and native validation.')
          PY
  published:
    name: ${{ matrix.target }} published Node ${{ matrix.node }}
    needs: verified
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "1927"
            sha: 54bdde21f28fa9499c85df24ed9668905e7dc0aa
            node: 22
            tests: "__tests__/cpp-specialization-names.test.ts __tests__/cpp-specialization-qualifiers.test.ts __tests__/expo-modules.test.ts __tests__/extraction.test.ts __tests__/function-ref-package-imports.test.ts __tests__/function-ref-project-imports.test.ts __tests__/function-ref.test.ts __tests__/kotlin-object-literal.test.ts __tests__/kotlin-property-receiver.test.ts __tests__/qualified-name-boundary.test.ts __tests__/resolution.test.ts __tests__/go-shadowed-function-value.test.ts"
          - target: "1927"
            sha: 54bdde21f28fa9499c85df24ed9668905e7dc0aa
            node: 24
            tests: "__tests__/cpp-specialization-names.test.ts __tests__/cpp-specialization-qualifiers.test.ts __tests__/expo-modules.test.ts __tests__/extraction.test.ts __tests__/function-ref-package-imports.test.ts __tests__/function-ref-project-imports.test.ts __tests__/function-ref.test.ts __tests__/kotlin-object-literal.test.ts __tests__/kotlin-property-receiver.test.ts __tests__/qualified-name-boundary.test.ts __tests__/resolution.test.ts __tests__/go-shadowed-function-value.test.ts"
          - target: "1928"
            sha: 8e77a4cef84e483078c1b35ce0f6c2d79cbf89d4
            node: 22
            tests: "__tests__/aosp-aidl.test.ts __tests__/aosp-common.test.ts __tests__/aosp-content-provider.test.ts __tests__/aosp-hal.test.ts __tests__/aosp-jni.test.ts __tests__/aosp-local-socket.test.ts __tests__/aosp-messenger.test.ts __tests__/aosp-permission-broadcast.test.ts __tests__/aosp-system-service.test.ts __tests__/mcp-initialize.test.ts __tests__/mcp-tool-allowlist.test.ts"
          - target: "1928"
            sha: 8e77a4cef84e483078c1b35ce0f6c2d79cbf89d4
            node: 24
            tests: "__tests__/aosp-aidl.test.ts __tests__/aosp-common.test.ts __tests__/aosp-content-provider.test.ts __tests__/aosp-hal.test.ts __tests__/aosp-jni.test.ts __tests__/aosp-local-socket.test.ts __tests__/aosp-messenger.test.ts __tests__/aosp-permission-broadcast.test.ts __tests__/aosp-system-service.test.ts __tests__/mcp-initialize.test.ts __tests__/mcp-tool-allowlist.test.ts"
          - target: "1929"
            sha: 1ff11b545f7f47a6b08c1702b3b52c4f21bb3a0e
            node: 22
            tests: "__tests__/mcp-initialize.test.ts __tests__/mcp-project-cache.test.ts __tests__/mcp-roots.test.ts"
          - target: "1929"
            sha: 1ff11b545f7f47a6b08c1702b3b52c4f21bb3a0e
            node: 24
            tests: "__tests__/mcp-initialize.test.ts __tests__/mcp-project-cache.test.ts __tests__/mcp-roots.test.ts"
          - target: "1930"
            sha: 3fe323f3b171135e009b49f657bedbbb0c3f1d8f
            node: 22
            tests: "__tests__/security.test.ts"
          - target: "1930"
            sha: 3fe323f3b171135e009b49f657bedbbb0c3f1d8f
            node: 24
            tests: "__tests__/security.test.ts"
          - target: "1931"
            sha: 668de06953b13e8b97828ac432be50fdbd39b4ed
            node: 22
            tests: ""
          - target: "1931"
            sha: 668de06953b13e8b97828ac432be50fdbd39b4ed
            node: 24
            tests: ""
          - target: "1948"
            sha: 45bc0e7f2db6b791f3c4240deecc41bdd8220606
            node: 22
            tests: "__tests__/function-ref-package-imports.test.ts __tests__/function-ref-project-imports.test.ts __tests__/function-ref.test.ts __tests__/kotlin-imported-type-call.test.ts __tests__/resolution.test.ts"
          - target: "1948"
            sha: 45bc0e7f2db6b791f3c4240deecc41bdd8220606
            node: 24
            tests: "__tests__/function-ref-package-imports.test.ts __tests__/function-ref-project-imports.test.ts __tests__/function-ref.test.ts __tests__/kotlin-imported-type-call.test.ts __tests__/resolution.test.ts"
          - target: "1949"
            sha: 4b5a7e18f718c869a00bffdf6ae27f9564f33dc7
            node: 22
            tests: "__tests__/extraction.test.ts __tests__/function-ref-package-imports.test.ts __tests__/function-ref-project-imports.test.ts __tests__/function-ref.test.ts __tests__/resolution.test.ts __tests__/go-shadowed-function-value.test.ts"
          - target: "1949"
            sha: 4b5a7e18f718c869a00bffdf6ae27f9564f33dc7
            node: 24
            tests: "__tests__/extraction.test.ts __tests__/function-ref-package-imports.test.ts __tests__/function-ref-project-imports.test.ts __tests__/function-ref.test.ts __tests__/resolution.test.ts __tests__/go-shadowed-function-value.test.ts"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify exact published commit
        run: test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p "$HOME/.ssh"
      - name: Focused portable regressions on published commit
        if: matrix.target != '1931'
        run: npx vitest run ${{ matrix.tests }} --maxWorkers=2 --minWorkers=1
        env:
          CODEGRAPH_KERNEL: '0'
      - name: Check contribution documentation links
        if: matrix.target == '1931'
        run: |
          node <<'JS'
          const fs = require('fs'), path = require('path');
          for (const file of ['CONTRIBUTING.md', 'README.md', 'docs/README.md']) {
            const body = fs.readFileSync(file, 'utf8');
            for (const match of body.matchAll(/\]\(([^)]+)\)/g)) {
              const link = match[1];
              if (link.includes('://') || link.startsWith('#') || link.startsWith('mailto:')) continue;
              const target = path.resolve(path.dirname(file), link.split(/[?#]/)[0]);
              if (!fs.existsSync(target)) throw new Error(file + ': broken link ' + link);
            }
          }
          console.log('All relative contribution documentation links resolve.');
          JS
  checks:
    name: Published contribution verification complete
    if: always()
    needs: [verified, published]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PROOF_RESULT: ${{ needs.verified.result }}
          PUBLISHED_RESULT: ${{ needs.published.result }}
        run: |
          test "$PROOF_RESULT" = success
          test "$PUBLISHED_RESULT" = success
