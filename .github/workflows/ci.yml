{
  "name": "External contributions 60b0 validation",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "stage": {
          "type": "choice",
          "options": [
            "candidate",
            "published"
          ],
          "default": "candidate"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "env": {
    "CODEGRAPH_TELEMETRY": "0",
    "CODEGRAPH_NO_UPDATE_CHECK": "1"
  },
  "jobs": {
    "guard": {
      "name": "Verify current remote refs",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "VALIDATION_STAGE": "${{ inputs.stage }}"
          },
          "run": "python3 - <<'PY'\nimport json,os,urllib.request\ndef get(path):\n req=urllib.request.Request('https://api.github.com/repos/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})\n with urllib.request.urlopen(req,timeout=30) as f:return json.load(f)\nexpected={'fix/java-kotlin-inheritance': '0e8a08d83e37d00f294070883412d361b4597358', 'feat/android-platform-tools': '8657968eb6999c2f53ae86436e498c423bdc87bd', 'fix/mcp-project-cache-lifetime': 'fc412ab84de928cb91f1f32e24d3c036ebe0a7c7', 'docs/contributing-guide': '416e2f737ad4f48ff10681bc4ad0ec042a204513', 'fix/java-static-field-calls': 'f78c3cff3e9efd866d12ca5cfe479360a62a8674'} if os.environ['VALIDATION_STAGE']=='published' else {'fix/java-kotlin-inheritance': 'e817803bb79fc461d19075758ba1e128529d3ba7', 'feat/android-platform-tools': '2031f201e6d2cf1afb92bee22e3fde200e9caa82', 'fix/mcp-project-cache-lifetime': 'a2e01c915470518c9d457f6de71095adfecfcd2d', 'docs/contributing-guide': '55f9761bd0f437351c11f65e65c949a84978cf05', 'fix/java-static-field-calls': 'a3e7dcdfa94eaad866d5c873be307eeb05b353ef'}\nprotected={'main': '649ec1134e6c7397d1133e90b4031850f80a6579', 'fix/android-platform-language-coverage': 'b497e567fdb95a7f200cded3f7e433dc3f572db4', 'fix/project-path-realpath': '4c8f64415f47228986dcac7e4ad2c7ca6e886797', 'fix/kotlin-imported-type-calls': '08c716f16b16ee0f55284264b8e0dacef4d018b3'}\nfor b,h in {**expected,**protected}.items():\n actual=get('mixxer/codegraph-aosp/git/ref/heads/'+b)['object']['sha'];assert actual==h,(b,h,actual)\nfor ref,h in {'tags/backup/pr1927-before-60b0-20261030-e817803b': 'e817803bb79fc461d19075758ba1e128529d3ba7', 'tags/backup/pr1928-before-60b0-20261030-2031f201': '2031f201e6d2cf1afb92bee22e3fde200e9caa82', 'tags/backup/pr1929-before-60b0-20261030-a2e01c91': 'a2e01c915470518c9d457f6de71095adfecfcd2d', 'tags/backup/pr1931-before-60b0-20261030-55f9761b': '55f9761bd0f437351c11f65e65c949a84978cf05', 'tags/backup/pr1949-before-60b0-20261030-a3e7dcdf': 'a3e7dcdfa94eaad866d5c873be307eeb05b353ef'}.items():assert get('mixxer/codegraph-aosp/git/ref/'+ref)['object']['sha']==h,ref\nassert get('colbymchenry/codegraph/branches/main')['commit']['sha']=='60b0d7a92dc001de1be37943ef3cd1cc955d693d'\nfor n in [1927, 1928, 1929, 1931, 1949]:assert get('colbymchenry/codegraph/pulls/'+str(n))['state']=='open',n\nfor n in [1930,1948]:assert get('colbymchenry/codegraph/pulls/'+str(n))['state']=='closed',n\nprint('Exact published/candidate source refs, recovery refs, protected daily and closed heads, PR states and current upstream verified.')\nPY"
        }
      ]
    },
    "portable": {
      "name": "${{ matrix.target }} portable Node ${{ matrix.node }}",
      "needs": "guard",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 35,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 8,
        "matrix": {
          "include": [
            {
              "target": "baseline",
              "sha": "60b0d7a92dc001de1be37943ef3cd1cc955d693d",
              "node": 22
            },
            {
              "target": "baseline",
              "sha": "60b0d7a92dc001de1be37943ef3cd1cc955d693d",
              "node": 24
            },
            {
              "target": "1927",
              "sha": "0e8a08d83e37d00f294070883412d361b4597358",
              "node": 22
            },
            {
              "target": "1927",
              "sha": "0e8a08d83e37d00f294070883412d361b4597358",
              "node": 24
            },
            {
              "target": "1928",
              "sha": "8657968eb6999c2f53ae86436e498c423bdc87bd",
              "node": 22
            },
            {
              "target": "1928",
              "sha": "8657968eb6999c2f53ae86436e498c423bdc87bd",
              "node": 24
            },
            {
              "target": "1929",
              "sha": "fc412ab84de928cb91f1f32e24d3c036ebe0a7c7",
              "node": 22
            },
            {
              "target": "1929",
              "sha": "fc412ab84de928cb91f1f32e24d3c036ebe0a7c7",
              "node": 24
            },
            {
              "target": "1931",
              "sha": "416e2f737ad4f48ff10681bc4ad0ec042a204513",
              "node": 22
            },
            {
              "target": "1931",
              "sha": "416e2f737ad4f48ff10681bc4ad0ec042a204513",
              "node": 24
            },
            {
              "target": "1949",
              "sha": "f78c3cff3e9efd866d12ca5cfe479360a62a8674",
              "node": 22
            },
            {
              "target": "1949",
              "sha": "f78c3cff3e9efd866d12ca5cfe479360a62a8674",
              "node": 24
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "${{ matrix.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source commit",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD)\" = \"${{ matrix.sha }}\"\necho \"Validated source ${{ matrix.sha }}\""
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": "${{ matrix.node }}",
            "cache": "npm"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "run": "npm run build"
        },
        {
          "run": "mkdir -p \"$HOME/.ssh\""
        },
        {
          "name": "Full portable engine and viewer",
          "env": {
            "CODEGRAPH_KERNEL": "0"
          },
          "run": "npm test -- --maxWorkers=2 --minWorkers=1"
        },
        {
          "name": "Documentation links",
          "if": "matrix.target == '1931'",
          "run": "node <<'JS'\nconst fs=require('fs'),p=require('path');for(const f of ['CONTRIBUTING.md','README.md','docs/README.md'])for(const m of fs.readFileSync(f,'utf8').matchAll(/\\]\\(([^)]+)\\)/g)){const u=m[1];if(u.includes('://')||u.startsWith('#')||u.startsWith('mailto:'))continue;if(!fs.existsSync(p.resolve(p.dirname(f),u.split(/[?#]/)[0])))throw Error(f+': '+u)}console.log('Documentation links resolve.');\nJS"
        }
      ]
    },
    "windows": {
      "name": "${{ matrix.target }} Windows Node ${{ matrix.node }}",
      "needs": "guard",
      "runs-on": "windows-latest",
      "timeout-minutes": 25,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 4,
        "matrix": {
          "include": [
            {
              "target": "baseline",
              "sha": "60b0d7a92dc001de1be37943ef3cd1cc955d693d",
              "node": 22
            },
            {
              "target": "baseline",
              "sha": "60b0d7a92dc001de1be37943ef3cd1cc955d693d",
              "node": 24
            },
            {
              "target": "1927",
              "sha": "0e8a08d83e37d00f294070883412d361b4597358",
              "node": 22
            },
            {
              "target": "1927",
              "sha": "0e8a08d83e37d00f294070883412d361b4597358",
              "node": 24
            },
            {
              "target": "1928",
              "sha": "8657968eb6999c2f53ae86436e498c423bdc87bd",
              "node": 22
            },
            {
              "target": "1928",
              "sha": "8657968eb6999c2f53ae86436e498c423bdc87bd",
              "node": 24
            },
            {
              "target": "1929",
              "sha": "fc412ab84de928cb91f1f32e24d3c036ebe0a7c7",
              "node": 22
            },
            {
              "target": "1929",
              "sha": "fc412ab84de928cb91f1f32e24d3c036ebe0a7c7",
              "node": 24
            },
            {
              "target": "1949",
              "sha": "f78c3cff3e9efd866d12ca5cfe479360a62a8674",
              "node": 22
            },
            {
              "target": "1949",
              "sha": "f78c3cff3e9efd866d12ca5cfe479360a62a8674",
              "node": 24
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "${{ matrix.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source commit",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD)\" = \"${{ matrix.sha }}\"\necho \"Validated source ${{ matrix.sha }}\""
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": "${{ matrix.node }}",
            "cache": "npm"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "run": "npm run build"
        },
        {
          "name": "Use an unambiguous Windows test temp path",
          "shell": "pwsh",
          "run": "$testTemp = Join-Path $env:RUNNER_TEMP 'codegraph-tests'\nNew-Item -ItemType Directory -Force $testTemp | Out-Null\n\"TEMP=$testTemp\" >> $env:GITHUB_ENV\n\"TMP=$testTemp\" >> $env:GITHUB_ENV\n"
        },
        {
          "name": "Windows path, watcher, MCP lifetime and Android regressions",
          "shell": "bash",
          "env": {
            "CODEGRAPH_KERNEL": "0",
            "VALIDATION_TARGET": "${{ matrix.target }}"
          },
          "run": "python - <<'PY'\nimport glob,os,subprocess,shutil\npatterns=['security.test.ts','mcp-nested-repo-projectpath.test.ts','mcp-roots.test.ts','mcp-initialize.test.ts','mcp-project-cache.test.ts','mcp-idle-release-order.test.ts','worktree-detection.test.ts','watcher.test.ts','ui-server.test.ts','cli-ui-command.test.ts','kotlin-*.test.ts','java-*.test.ts','jvm-cross-language-imports.test.ts','cross-file-visibility.test.ts','dotdot-folder-names.test.ts']\nif os.environ['VALIDATION_TARGET']=='1928': patterns+=['aosp-*.test.ts','mcp-tool-allowlist.test.ts']\nfiles=sorted({p for pat in patterns for p in glob.glob('__tests__/'+pat)})\nassert files\nnode=shutil.which('node'); assert node\ncli=os.path.abspath('node_modules/vitest/vitest.mjs'); assert os.path.isfile(cli)\nenv={**os.environ,'PATH':os.path.abspath('node_modules/.bin')+os.pathsep+os.environ['PATH']}\nsubprocess.run([node,cli,'run',*files,'--maxWorkers=2','--minWorkers=1'],env=env,check=True)\nPY"
        }
      ]
    },
    "native": {
      "name": "${{ matrix.target }} native kernel and language regressions",
      "needs": [
        "guard",
        "portable",
        "windows"
      ],
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 45,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 4,
        "matrix": {
          "include": [
            {
              "target": "baseline",
              "sha": "60b0d7a92dc001de1be37943ef3cd1cc955d693d"
            },
            {
              "target": "1927",
              "sha": "0e8a08d83e37d00f294070883412d361b4597358"
            },
            {
              "target": "1928",
              "sha": "8657968eb6999c2f53ae86436e498c423bdc87bd"
            },
            {
              "target": "1929",
              "sha": "fc412ab84de928cb91f1f32e24d3c036ebe0a7c7"
            },
            {
              "target": "1931",
              "sha": "416e2f737ad4f48ff10681bc4ad0ec042a204513"
            },
            {
              "target": "1949",
              "sha": "f78c3cff3e9efd866d12ca5cfe479360a62a8674"
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "${{ matrix.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source commit",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD)\" = \"${{ matrix.sha }}\"\necho \"Validated source ${{ matrix.sha }}\""
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": 22,
            "cache": "npm"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "name": "Build fresh native kernel after every full portable suite",
          "run": "bash scripts/build-kernel.sh --target x86_64-unknown-linux-gnu"
        },
        {
          "run": "npm run build"
        },
        {
          "name": "Require binary and twenty-language native contract",
          "env": {
            "CODEGRAPH_KERNEL_EXPECT": "1"
          },
          "run": "test -s codegraph-kernel/prebuilds/linux-x64/codegraph-kernel.node\nnode -e \"const assert=require('node:assert/strict'),l=require('./dist/extraction/kernel/loader'),k=l.getKernel();assert(k);const c=k.contractInfo();assert.equal(c.languages.length,20);for(const v of c.languages)assert(l.kernelSupports(v));assert(!l.kernelSupports('objc'));console.log(JSON.stringify(c));\""
        },
        {
          "name": "Native parity, language, MCP and Android regressions",
          "env": {
            "CODEGRAPH_KERNEL_EXPECT": "1"
          },
          "run": "python3 - <<'PY'\nimport glob,subprocess\npatterns=['kernel-*.test.ts', 'kotlin-*.test.ts', 'java-*.test.ts', 'aosp-*.test.ts', 'rust-*.test.ts', 'ruby-*.test.ts', 'go-*.test.ts', 'pascal-*.test.ts', 'frameworks-integration.test.ts', 'extraction.test.ts', 'resolution.test.ts', 'function-ref*.test.ts', 'generic-supertypes.test.ts', 'override-overload-pairing.test.ts', 'mcp-project-cache.test.ts', 'mcp-idle-release-order.test.ts', 'security.test.ts', 'mcp-tool-allowlist.test.ts', 'mcp-initialize.test.ts', 'mcp-roots.test.ts', 'watcher.test.ts', 'enclosing-class-member-call.test.ts', 'sync-framework-detection.test.ts', 'path-alias-overlap.test.ts','jvm-cross-language-imports.test.ts','cross-file-visibility.test.ts','browser-host-globals.test.ts','commonjs-exports.test.ts','spring-route-handlers.test.ts','frameworks.test.ts','component-same-folder.test.ts','segment-vocab.test.ts','search-field-filters.test.ts','qualified-lookup-boundary.test.ts','dotdot-folder-names.test.ts','cli-affected-filter-globs.test.ts']\nfiles=sorted({p for pat in patterns for p in glob.glob('__tests__/'+pat)})\nassert files\nsubprocess.run(['npx','vitest','run',*files,'--maxWorkers=2','--minWorkers=1'],check=True)\nPY"
        }
      ]
    },
    "checks": {
      "name": "All external contribution validation complete",
      "if": "always()",
      "needs": [
        "guard",
        "portable",
        "windows",
        "native"
      ],
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "env": {
            "GUARD": "${{ needs.guard.result }}",
            "PORTABLE": "${{ needs.portable.result }}",
            "WINDOWS": "${{ needs.windows.result }}",
            "NATIVE": "${{ needs.native.result }}"
          },
          "run": "test \"$GUARD\" = success\ntest \"$PORTABLE\" = success\ntest \"$WINDOWS\" = success\ntest \"$NATIVE\" = success"
        }
      ]
    }
  }
}
