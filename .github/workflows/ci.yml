{
  "name": "Windows downstream 31ec path guards and sync",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "CODEGRAPH_TELEMETRY": "0",
    "CODEGRAPH_NO_UPDATE_CHECK": "1"
  },
  "jobs": {
    "windows": {
      "name": "${{ matrix.target }} Windows Node ${{ matrix.node }}",
      "runs-on": "windows-latest",
      "timeout-minutes": 25,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "target": "upstream",
              "sha": "31ec90822455e9322f792a18c0f248127fb05f6a",
              "node": 22
            },
            {
              "target": "upstream",
              "sha": "31ec90822455e9322f792a18c0f248127fb05f6a",
              "node": 24
            },
            {
              "target": "main",
              "sha": "1932373a46062520a1ddf3a7f72934ceaadfe517",
              "node": 22
            },
            {
              "target": "main",
              "sha": "1932373a46062520a1ddf3a7f72934ceaadfe517",
              "node": 24
            },
            {
              "target": "pr15-compat",
              "sha": "860bd31a957c94a74cc9be729ca9260cbc5d1cf8",
              "node": 22
            },
            {
              "target": "pr15-compat",
              "sha": "860bd31a957c94a74cc9be729ca9260cbc5d1cf8",
              "node": 24
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "${{ matrix.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source SHA",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD)\" = \"${{ matrix.sha }}\"\necho \"Validated source ${{ matrix.sha }}\""
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": "${{ matrix.node }}",
            "cache": "npm"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "run": "npm run build"
        },
        {
          "name": "Use an unambiguous Windows test temp path",
          "shell": "pwsh",
          "run": "$testTemp = Join-Path $env:RUNNER_TEMP 'codegraph-tests'\nNew-Item -ItemType Directory -Force $testTemp | Out-Null\n\"TEMP=$testTemp\" >> $env:GITHUB_ENV\n\"TMP=$testTemp\" >> $env:GITHUB_ENV\nWrite-Output \"Test temporary directory: $testTemp\"\n"
        },
        {
          "name": "Windows path guards, MCP, worktree and framework sync",
          "shell": "bash",
          "env": {
            "CODEGRAPH_KERNEL": "0"
          },
          "run": "npx vitest run __tests__/sync-framework-detection.test.ts __tests__/security.test.ts __tests__/ui-server.test.ts __tests__/cli-ui-command.test.ts __tests__/mcp-nested-repo-projectpath.test.ts __tests__/worktree-detection.test.ts __tests__/ui-package.test.ts --maxWorkers=2 --minWorkers=1"
        }
      ]
    },
    "checks": {
      "name": "Windows validation complete",
      "needs": "windows",
      "if": "always()",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "env": {
            "RESULT": "${{ needs.windows.result }}"
          },
          "run": "test \"$RESULT\" = success"
        }
      ]
    }
  }
}
