{
  "name": "Windows downstream 69af validation",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "CODEGRAPH_TELEMETRY": "0",
    "CODEGRAPH_NO_UPDATE_CHECK": "1"
  },
  "jobs": {
    "windows": {
      "name": "${{ matrix.target }} Windows Node ${{ matrix.node }}",
      "runs-on": "windows-latest",
      "timeout-minutes": 25,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "target": "upstream",
              "sha": "69af19ace270f2e940444d514de6dde971df12df",
              "node": 22
            },
            {
              "target": "upstream",
              "sha": "69af19ace270f2e940444d514de6dde971df12df",
              "node": 24
            },
            {
              "target": "main",
              "sha": "f3e7ba442bfb863e5fc09d06d7b2d310993f212a",
              "node": 22
            },
            {
              "target": "main",
              "sha": "f3e7ba442bfb863e5fc09d06d7b2d310993f212a",
              "node": 24
            },
            {
              "target": "pr15-compat",
              "sha": "b2b5d7ed01ebd5253b032bfaa6d45ce66afbf4a3",
              "node": 22
            },
            {
              "target": "pr15-compat",
              "sha": "b2b5d7ed01ebd5253b032bfaa6d45ce66afbf4a3",
              "node": 24
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "${{ matrix.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source SHA",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD)\" = \"${{ matrix.sha }}\"\necho \"Validated source ${{ matrix.sha }}\""
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": "${{ matrix.node }}",
            "cache": "npm"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "run": "npm run build"
        },
        {
          "name": "Windows build and changed-behavior regressions",
          "shell": "bash",
          "env": {
            "CODEGRAPH_KERNEL": "0"
          },
          "run": "npx vitest run __tests__/frameworks-integration.test.ts __tests__/same-file-match-confidence.test.ts __tests__/mcp-idle-release-order.test.ts __tests__/explore-output-budget.test.ts __tests__/ui-package.test.ts --maxWorkers=2 --minWorkers=1"
        }
      ]
    },
    "checks": {
      "name": "Windows validation complete",
      "needs": "windows",
      "if": "always()",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "env": {
            "RESULT": "${{ needs.windows.result }}"
          },
          "run": "test \"$RESULT\" = success"
        }
      ]
    }
  }
}
