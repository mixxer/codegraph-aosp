name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CODEGRAPH_TELEMETRY: '0'
  CODEGRAPH_NO_UPDATE_CHECK: '1'
jobs:
  windows-paths:
    name: ${{ matrix.label }} / Windows path validation
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: upstream
            sha: 6560052a6f856855d3f71eee838fd66ccfa4285d
          - label: PR 1930
            sha: 0f75b0d0e7076fb858fbbddf346cbc47a5754307
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: New-Item -ItemType Directory -Force -Path "$HOME/.ssh"
      - run: npx vitest run __tests__/security.test.ts -t validateProjectPath --maxWorkers=2 --minWorkers=1
        env:
          CODEGRAPH_KERNEL: '0'
