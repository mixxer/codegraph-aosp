name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CODEGRAPH_TELEMETRY: '0'
  CODEGRAPH_NO_UPDATE_CHECK: '1'
jobs:
  portable:
    name: ${{ matrix.target }} portable Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "baseline"
            sha: 88ebefa1353806a48f914d6d66807b24dfa235e6
            node: 22
          - target: "baseline"
            sha: 88ebefa1353806a48f914d6d66807b24dfa235e6
            node: 24
          - target: "1927"
            sha: 403ffda0f062ecf2bece391ddc31539743e507e9
            node: 22
          - target: "1927"
            sha: 403ffda0f062ecf2bece391ddc31539743e507e9
            node: 24
          - target: "1928"
            sha: efce7949aa3e87d67176159c628da7a3502aff3f
            node: 22
          - target: "1928"
            sha: efce7949aa3e87d67176159c628da7a3502aff3f
            node: 24
          - target: "1929"
            sha: b3ddd7687e4379c8dc0d900c127d93294ec7d514
            node: 22
          - target: "1929"
            sha: b3ddd7687e4379c8dc0d900c127d93294ec7d514
            node: 24
          - target: "1930"
            sha: 1f2df4e22c3a3b476bb23122488055437aa7069f
            node: 22
          - target: "1930"
            sha: 1f2df4e22c3a3b476bb23122488055437aa7069f
            node: 24
          - target: "1931"
            sha: dc0b41cba2b68a223cd16d75a285400fad806ec0
            node: 22
          - target: "1931"
            sha: dc0b41cba2b68a223cd16d75a285400fad806ec0
            node: 24
          - target: "1948"
            sha: c13fc80ca1741ecb0f351d9a6748409b234a643a
            node: 22
          - target: "1948"
            sha: c13fc80ca1741ecb0f351d9a6748409b234a643a
            node: 24
          - target: "1949"
            sha: e8893dda30ba51bdca9191cf0282332ec814e3b2
            node: 22
          - target: "1949"
            sha: e8893dda30ba51bdca9191cf0282332ec814e3b2
            node: 24
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify exact target commit
        run: test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p "$HOME/.ssh"
      - name: Full portable suite
        run: npm test -- --maxWorkers=2 --minWorkers=1
        env:
          CODEGRAPH_KERNEL: '0'
  windows:
    name: ${{ matrix.target }} Windows ${{ matrix.focus }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "baseline"
            sha: 88ebefa1353806a48f914d6d66807b24dfa235e6
            focus: security
            tests: __tests__/security.test.ts -t validateProjectPath
          - target: "1930"
            sha: 1f2df4e22c3a3b476bb23122488055437aa7069f
            focus: security
            tests: __tests__/security.test.ts -t validateProjectPath
          - target: "1928"
            sha: efce7949aa3e87d67176159c628da7a3502aff3f
            focus: MCP
            tests: __tests__/mcp-initialize.test.ts __tests__/mcp-roots.test.ts __tests__/mcp-tool-allowlist.test.ts
          - target: "1929"
            sha: b3ddd7687e4379c8dc0d900c127d93294ec7d514
            focus: MCP
            tests: __tests__/mcp-project-cache.test.ts __tests__/mcp-initialize.test.ts __tests__/mcp-roots.test.ts
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify exact target commit
        shell: pwsh
        run: if ((git rev-parse HEAD).Trim() -ne '${{ matrix.sha }}') { throw 'Unexpected target SHA' }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - shell: pwsh
        run: New-Item -ItemType Directory -Force (Join-Path $HOME '.ssh') | Out-Null
      - name: Windows platform regressions
        run: npx vitest run ${{ matrix.tests }} --maxWorkers=2 --minWorkers=1
        env:
          CODEGRAPH_KERNEL: '0'
  native:
    name: ${{ matrix.target }} native kernel and language regressions
    needs: [portable, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "baseline"
            sha: 88ebefa1353806a48f914d6d66807b24dfa235e6
          - target: "1927"
            sha: 403ffda0f062ecf2bece391ddc31539743e507e9
          - target: "1928"
            sha: efce7949aa3e87d67176159c628da7a3502aff3f
          - target: "1948"
            sha: c13fc80ca1741ecb0f351d9a6748409b234a643a
          - target: "1949"
            sha: e8893dda30ba51bdca9191cf0282332ec814e3b2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify exact target commit
        run: test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build native kernel after portable suites
        run: bash scripts/build-kernel.sh --target x86_64-unknown-linux-gnu
      - run: npm run build
      - run: test -s codegraph-kernel/prebuilds/linux-x64/codegraph-kernel.node
      - name: Native parity, language and Android regressions
        run: >-
          npx vitest run
          __tests__/kernel-*.test.ts
          __tests__/pascal-param-attributes.test.ts
          __tests__/pascal-for-in-var.test.ts
          __tests__/go-shadowed-function-value.test.ts
          __tests__/kotlin-*.test.ts
          __tests__/aosp-*.test.ts
          __tests__/extraction.test.ts
          __tests__/resolution.test.ts
          __tests__/function-ref*.test.ts
          __tests__/qualified-name-boundary.test.ts
          __tests__/cpp-specialization*.test.ts
          __tests__/expo-modules.test.ts
          --maxWorkers=2 --minWorkers=1
        env:
          CODEGRAPH_KERNEL_EXPECT: '1'
  checks:
    name: Seven PR validation complete
    if: always()
    needs: [portable, windows, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$PORTABLE_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$NATIVE_RESULT" = success
