name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CODEGRAPH_TELEMETRY: '0'
  CODEGRAPH_NO_UPDATE_CHECK: '1'
jobs:
  previous:
    name: Require unchanged target validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require seventeen unchanged portable and Windows jobs
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          expected = {f'{target} portable Node {node}' for target in ['baseline', '1927', '1929', '1930', '1931', '1948', '1949'] for node in [22, 24]}
          expected.update(['baseline Windows security', '1930 Windows security', '1929 Windows MCP'])
          for attempt in range(20):
              with urllib.request.urlopen('https://api.github.com/repos/mixxer/codegraph-aosp/actions/runs/39714365273/jobs?per_page=100', timeout=30) as response:
                  actual = {job['name']: job for job in json.load(response)['jobs']}
              assert len(expected) == 17 and expected <= actual.keys()
              failed = [name for name in expected if actual[name]['conclusion'] in ['failure', 'cancelled', 'timed_out']]
              assert not failed, failed
              pending = [name for name in expected if actual[name]['conclusion'] != 'success']
              if not pending:
                  print('All seventeen unchanged target jobs passed at their pinned commits.')
                  break
              print('Waiting for unchanged targets:', pending, flush=True)
              time.sleep(45)
          else:
              raise RuntimeError('Unchanged target validation did not finish in time')
          PY
  portable:
    name: ${{ matrix.target }} portable Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "1928"
            sha: 8e77a4cef84e483078c1b35ce0f6c2d79cbf89d4
            node: 22
          - target: "1928"
            sha: 8e77a4cef84e483078c1b35ce0f6c2d79cbf89d4
            node: 24
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify exact target commit
        run: test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p "$HOME/.ssh"
      - name: Full portable suite
        run: npm test -- --maxWorkers=2 --minWorkers=1
        env:
          CODEGRAPH_KERNEL: '0'
  windows:
    name: ${{ matrix.target }} Windows ${{ matrix.focus }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "1928"
            sha: 8e77a4cef84e483078c1b35ce0f6c2d79cbf89d4
            focus: MCP
            tests: __tests__/mcp-initialize.test.ts __tests__/mcp-roots.test.ts __tests__/mcp-tool-allowlist.test.ts
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify exact target commit
        shell: pwsh
        run: if ((git rev-parse HEAD).Trim() -ne '${{ matrix.sha }}') { throw 'Unexpected target SHA' }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - shell: pwsh
        run: New-Item -ItemType Directory -Force (Join-Path $HOME '.ssh') | Out-Null
      - name: Windows platform regressions
        run: npx vitest run ${{ matrix.tests }} --maxWorkers=2 --minWorkers=1
        env:
          CODEGRAPH_KERNEL: '0'
  native:
    name: ${{ matrix.target }} native kernel and language regressions
    needs: [previous, portable, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "baseline"
            sha: c326b6bec19a826f679a1fd8ec325888521ccde1
          - target: "1927"
            sha: 54bdde21f28fa9499c85df24ed9668905e7dc0aa
          - target: "1928"
            sha: 8e77a4cef84e483078c1b35ce0f6c2d79cbf89d4
          - target: "1948"
            sha: 45bc0e7f2db6b791f3c4240deecc41bdd8220606
          - target: "1949"
            sha: 4b5a7e18f718c869a00bffdf6ae27f9564f33dc7
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify exact target commit
        run: test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build native kernel after portable suites
        run: bash scripts/build-kernel.sh --target x86_64-unknown-linux-gnu
      - run: npm run build
      - run: test -s codegraph-kernel/prebuilds/linux-x64/codegraph-kernel.node
      - name: Native parity, language and Android regressions
        run: >-
          npx vitest run
          __tests__/kernel-*.test.ts
          __tests__/kotlin-*.test.ts
          __tests__/aosp-*.test.ts
          __tests__/extraction.test.ts
          __tests__/resolution.test.ts
          __tests__/function-ref*.test.ts
          __tests__/qualified-name-boundary.test.ts
          __tests__/cpp-specialization*.test.ts
          __tests__/expo-modules.test.ts
          --maxWorkers=2 --minWorkers=1
        env:
          CODEGRAPH_KERNEL_EXPECT: '1'
  checks:
    name: Seven PR validation complete
    if: always()
    needs: [portable, windows, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$PORTABLE_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$NATIVE_RESULT" = success
