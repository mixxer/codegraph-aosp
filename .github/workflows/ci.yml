name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CODEGRAPH_TELEMETRY: '0'
  CODEGRAPH_NO_UPDATE_CHECK: '1'
jobs:
  verified:
    name: Verify published heads and full validation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check exact published refs and prior full portable/native results
        run: |
          python3 - <<'PY'
          import json, urllib.request

          def read(path):
              with urllib.request.urlopen('https://api.github.com/repos/mixxer/codegraph-aosp/' + path, timeout=30) as response:
                  return json.load(response)
          run = read('actions/runs/39718249586')
          assert run['head_sha'] == '739dd0cf32df501cf9767ad6683d09e6d701df55' and run['conclusion'] == 'success'
          jobs = read('actions/runs/39718249586/jobs?per_page=100')['jobs']
          assert len(jobs) == 26 and all(job['conclusion'] == 'success' for job in jobs)
          refs = {'fix/java-kotlin-inheritance': 'd557995a8092b8aeeb4814782afba56f027fec77', 'feat/android-platform-tools': '01e087e6a16472e19de61b26363e8938c5f80c25', 'fix/mcp-project-cache-lifetime': 'eb73521e434365bc37922ba423e0303596f97313', 'fix/project-path-realpath': '9276cfcf5a41c894c8932c001adef6c35d4b054d', 'docs/contributing-guide': '096839950a785c1c48c518387e407cfc412c61a4', 'fix/kotlin-imported-type-calls': '74a2d74c1688c78dfb06b5235ea79ace72691f2d', 'fix/java-static-field-calls': 'e693105aedc6f047f18ed414c81f940d44f960ad', 'main': '6dde0e8b4568ab6797da34b33250cb994ac198e8', 'fix/android-platform-language-coverage': 'd1e05ef4d039bbbecc8e96cd8a8e1e31277b9b6c'}
          actual_heads = {item['ref'].removeprefix('refs/heads/'): item['object']['sha'] for item in read('git/matching-refs/heads')}
          for branch, sha in refs.items():
              assert actual_heads.get(branch) == sha, (branch, sha, actual_heads.get(branch))
              print(branch, sha)
          tags = {'refs/tags/backup/upstream-pr1927-before-rebase-20261022-3bfb25c0': '3bfb25c07ef5d41df097e861786042b920c71927', 'refs/tags/backup/upstream-pr1928-before-rebase-20261022-9dcb4f9e': '9dcb4f9e007fb6ea03e326b1207cc0c8c9af3f04', 'refs/tags/backup/upstream-pr1929-before-rebase-20261022-7398a498': '7398a498102d58cff96e296e8ae6ce45e3109c5b', 'refs/tags/backup/upstream-pr1930-before-rebase-20261022-0f75b0d0': '0f75b0d0e7076fb858fbbddf346cbc47a5754307', 'refs/tags/backup/upstream-pr1931-before-rebase-20261022-07a229bc': '07a229bc49b58b13a989a0a35a041ee40d3ce6ad', 'refs/tags/backup/upstream-pr1948-before-rebase-20261022-3a9e7461': '3a9e74619f6955bebef38d0abe6faaaf90db6873', 'refs/tags/backup/upstream-pr1949-before-rebase-20261022-33737125': '33737125e7a5fd336738fcac95bd04d8443a6ba6'}
          actual_tags = {item['ref']: item['object']['sha'] for item in read('git/matching-refs/tags/backup/upstream-pr')}
          assert all(actual_tags.get(ref) == sha for ref, sha in tags.items())
          print('Verified old-head backup tags and published commits with full Node22/24, Windows and native success.')
          PY
  published:
    name: ${{ matrix.target }} published Node ${{ matrix.node }}
    needs: verified
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "1927"
            sha: d557995a8092b8aeeb4814782afba56f027fec77
            node: 22
            tests: "__tests__/upgrade.test.ts __tests__/cpp-specialization-names.test.ts __tests__/cpp-specialization-qualifiers.test.ts __tests__/expo-modules.test.ts __tests__/extraction.test.ts __tests__/function-ref-package-imports.test.ts __tests__/function-ref-project-imports.test.ts __tests__/function-ref.test.ts __tests__/kotlin-object-literal.test.ts __tests__/kotlin-property-receiver.test.ts __tests__/qualified-name-boundary.test.ts __tests__/resolution.test.ts __tests__/go-shadowed-function-value.test.ts"
          - target: "1927"
            sha: d557995a8092b8aeeb4814782afba56f027fec77
            node: 24
            tests: "__tests__/upgrade.test.ts __tests__/cpp-specialization-names.test.ts __tests__/cpp-specialization-qualifiers.test.ts __tests__/expo-modules.test.ts __tests__/extraction.test.ts __tests__/function-ref-package-imports.test.ts __tests__/function-ref-project-imports.test.ts __tests__/function-ref.test.ts __tests__/kotlin-object-literal.test.ts __tests__/kotlin-property-receiver.test.ts __tests__/qualified-name-boundary.test.ts __tests__/resolution.test.ts __tests__/go-shadowed-function-value.test.ts"
          - target: "1928"
            sha: 01e087e6a16472e19de61b26363e8938c5f80c25
            node: 22
            tests: "__tests__/upgrade.test.ts __tests__/aosp-aidl.test.ts __tests__/aosp-common.test.ts __tests__/aosp-content-provider.test.ts __tests__/aosp-hal.test.ts __tests__/aosp-jni.test.ts __tests__/aosp-local-socket.test.ts __tests__/aosp-messenger.test.ts __tests__/aosp-permission-broadcast.test.ts __tests__/aosp-system-service.test.ts __tests__/mcp-initialize.test.ts __tests__/mcp-tool-allowlist.test.ts"
          - target: "1928"
            sha: 01e087e6a16472e19de61b26363e8938c5f80c25
            node: 24
            tests: "__tests__/upgrade.test.ts __tests__/aosp-aidl.test.ts __tests__/aosp-common.test.ts __tests__/aosp-content-provider.test.ts __tests__/aosp-hal.test.ts __tests__/aosp-jni.test.ts __tests__/aosp-local-socket.test.ts __tests__/aosp-messenger.test.ts __tests__/aosp-permission-broadcast.test.ts __tests__/aosp-system-service.test.ts __tests__/mcp-initialize.test.ts __tests__/mcp-tool-allowlist.test.ts"
          - target: "1929"
            sha: eb73521e434365bc37922ba423e0303596f97313
            node: 22
            tests: "__tests__/upgrade.test.ts __tests__/mcp-initialize.test.ts __tests__/mcp-project-cache.test.ts __tests__/mcp-roots.test.ts"
          - target: "1929"
            sha: eb73521e434365bc37922ba423e0303596f97313
            node: 24
            tests: "__tests__/upgrade.test.ts __tests__/mcp-initialize.test.ts __tests__/mcp-project-cache.test.ts __tests__/mcp-roots.test.ts"
          - target: "1930"
            sha: 9276cfcf5a41c894c8932c001adef6c35d4b054d
            node: 22
            tests: "__tests__/upgrade.test.ts __tests__/security.test.ts"
          - target: "1930"
            sha: 9276cfcf5a41c894c8932c001adef6c35d4b054d
            node: 24
            tests: "__tests__/upgrade.test.ts __tests__/security.test.ts"
          - target: "1931"
            sha: 096839950a785c1c48c518387e407cfc412c61a4
            node: 22
            tests: "__tests__/upgrade.test.ts "
          - target: "1931"
            sha: 096839950a785c1c48c518387e407cfc412c61a4
            node: 24
            tests: "__tests__/upgrade.test.ts "
          - target: "1948"
            sha: 74a2d74c1688c78dfb06b5235ea79ace72691f2d
            node: 22
            tests: "__tests__/upgrade.test.ts __tests__/function-ref-package-imports.test.ts __tests__/function-ref-project-imports.test.ts __tests__/function-ref.test.ts __tests__/kotlin-imported-type-call.test.ts __tests__/resolution.test.ts"
          - target: "1948"
            sha: 74a2d74c1688c78dfb06b5235ea79ace72691f2d
            node: 24
            tests: "__tests__/upgrade.test.ts __tests__/function-ref-package-imports.test.ts __tests__/function-ref-project-imports.test.ts __tests__/function-ref.test.ts __tests__/kotlin-imported-type-call.test.ts __tests__/resolution.test.ts"
          - target: "1949"
            sha: e693105aedc6f047f18ed414c81f940d44f960ad
            node: 22
            tests: "__tests__/upgrade.test.ts __tests__/extraction.test.ts __tests__/function-ref-package-imports.test.ts __tests__/function-ref-project-imports.test.ts __tests__/function-ref.test.ts __tests__/resolution.test.ts __tests__/go-shadowed-function-value.test.ts"
          - target: "1949"
            sha: e693105aedc6f047f18ed414c81f940d44f960ad
            node: 24
            tests: "__tests__/upgrade.test.ts __tests__/extraction.test.ts __tests__/function-ref-package-imports.test.ts __tests__/function-ref-project-imports.test.ts __tests__/function-ref.test.ts __tests__/resolution.test.ts __tests__/go-shadowed-function-value.test.ts"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify exact published commit
        run: test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p "$HOME/.ssh"
      - name: Focused portable regressions on published commit
        run: npx vitest run ${{ matrix.tests }} --maxWorkers=2 --minWorkers=1
        env:
          CODEGRAPH_KERNEL: '0'
      - name: Check contribution documentation links
        if: matrix.target == '1931'
        run: |
          node <<'JS'
          const fs = require('fs'), path = require('path');
          for (const file of ['CONTRIBUTING.md', 'README.md', 'docs/README.md']) {
            const body = fs.readFileSync(file, 'utf8');
            for (const match of body.matchAll(/\]\(([^)]+)\)/g)) {
              const link = match[1];
              if (link.includes('://') || link.startsWith('#') || link.startsWith('mailto:')) continue;
              const target = path.resolve(path.dirname(file), link.split(/[?#]/)[0]);
              if (!fs.existsSync(target)) throw new Error(file + ': broken link ' + link);
            }
          }
          console.log('All relative contribution documentation links resolve.');
          JS
  checks:
    name: Published contribution verification complete
    if: always()
    needs: [verified, published]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PROOF_RESULT: ${{ needs.verified.result }}
          PUBLISHED_RESULT: ${{ needs.published.result }}
        run: |
          test "$PROOF_RESULT" = success
          test "$PUBLISHED_RESULT" = success
