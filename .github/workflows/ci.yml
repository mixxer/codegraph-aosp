{
  "name": "Windows downstream 7973 Java Android and path compatibility",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "CODEGRAPH_TELEMETRY": "0",
    "CODEGRAPH_NO_UPDATE_CHECK": "1"
  },
  "jobs": {
    "windows": {
      "name": "${{ matrix.target }} Windows Node ${{ matrix.node }}",
      "runs-on": "windows-latest",
      "timeout-minutes": 25,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "target": "upstream",
              "sha": "7973df0d0978ccf6f7fa531776ea0d6d77397461",
              "node": 22
            },
            {
              "target": "upstream",
              "sha": "7973df0d0978ccf6f7fa531776ea0d6d77397461",
              "node": 24
            },
            {
              "target": "main",
              "sha": "b130a9eff38501790d3b89df74fb35773467ce7b",
              "node": 22
            },
            {
              "target": "main",
              "sha": "b130a9eff38501790d3b89df74fb35773467ce7b",
              "node": 24
            },
            {
              "target": "pr15-compat",
              "sha": "96cffcd438c10b56fa2159fb059f33351e01404e",
              "node": 22
            },
            {
              "target": "pr15-compat",
              "sha": "96cffcd438c10b56fa2159fb059f33351e01404e",
              "node": 24
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "${{ matrix.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact source SHA",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD)\" = \"${{ matrix.sha }}\"\necho \"Validated source ${{ matrix.sha }}\""
        },
        {
          "uses": "actions/setup-node@v6",
          "with": {
            "node-version": "${{ matrix.node }}",
            "cache": "npm"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "run": "npm run build"
        },
        {
          "name": "Use an unambiguous Windows test temp path",
          "shell": "pwsh",
          "run": "$testTemp = Join-Path $env:RUNNER_TEMP 'codegraph-tests'\nNew-Item -ItemType Directory -Force $testTemp | Out-Null\n\"TEMP=$testTemp\" >> $env:GITHUB_ENV\n\"TMP=$testTemp\" >> $env:GITHUB_ENV\nWrite-Output \"Test temporary directory: $testTemp\"\n"
        },
        {
          "name": "Java receivers, path, watcher, installer, class member, MCP and sync regressions",
          "shell": "bash",
          "env": {
            "CODEGRAPH_KERNEL": "0"
          },
          "run": "npx vitest run __tests__/java-receiver-type.test.ts __tests__/go-chained-receivers.test.ts __tests__/go-receiver-type.test.ts __tests__/go-std-method-receivers.test.ts __tests__/mpeg-ts-not-typescript.test.ts __tests__/rust-module-path-call.test.ts __tests__/watcher.test.ts __tests__/enclosing-class-member-call.test.ts __tests__/install-ps1-version.test.ts __tests__/sync-framework-detection.test.ts __tests__/security.test.ts __tests__/ui-server.test.ts __tests__/cli-ui-command.test.ts __tests__/mcp-nested-repo-projectpath.test.ts __tests__/worktree-detection.test.ts __tests__/ui-package.test.ts --maxWorkers=2 --minWorkers=1"
        }
      ]
    },
    "checks": {
      "name": "Windows validation complete",
      "needs": "windows",
      "if": "always()",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "env": {
            "RESULT": "${{ needs.windows.result }}"
          },
          "run": "test \"$RESULT\" = success"
        }
      ]
    }
  }
}
