name: Windows compatibility proof
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CODEGRAPH_TELEMETRY: '0'
  CODEGRAPH_NO_UPDATE_CHECK: '1'
  CODEGRAPH_KERNEL: '0'
jobs:
  windows:
    name: Windows ${{ matrix.target.name }} Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        target:
          - { name: upstream, sha: 3a93f57ae1796b47cf6f27e8685e58de957392c3 }
          - { name: downstream, sha: b6ae433cface2fe3828a6387d97c75b1834eb6d9 }
          - { name: pr15, sha: f1ed60e2ab1b9685aa00aa4e7f3ccbe6f5ef5da1 }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.target.sha }}
          persist-credentials: false
      - name: Require the exact requested source
        shell: pwsh
        env:
          EXPECTED: ${{ matrix.target.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED) { throw "Wrong source SHA: $actual" }
          Write-Output "Validated source $actual"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Windows process, lock and status regressions
        run: >-
          npx vitest run
          __tests__/child-process-windows-hide.test.ts
          __tests__/daemon-lock-holder.test.ts
          __tests__/cli-unlock.test.ts
          __tests__/status-index-health.test.ts
          --maxWorkers=2 --minWorkers=1
  checks:
    if: always()
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.windows.result }}
        run: test "$RESULT" = success
